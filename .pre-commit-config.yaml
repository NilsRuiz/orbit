# Git hooks for humans and Claude alike. Install:
#   pre-commit install --install-hooks && pre-commit install --hook-type commit-msg
# Update pinned versions: pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  # Secret scanning before anything leaves the laptop.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Commit message must follow Conventional Commits.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, perf, refactor, test, docs, build, ci, chore, revert]

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.5
    hooks:
      - id: terraform_fmt
      - id: terraform_tflint

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet-agent
        name: go vet (agent)
        entry: bash -c 'cd agent && go vet ./...'
        language: system
        files: ^agent/.*\.go$
        pass_filenames: false
      - id: go-vet-operator
        name: go vet (operator)
        entry: bash -c 'cd operator && go vet ./...'
        language: system
        files: ^operator/.*\.go$
        pass_filenames: false
