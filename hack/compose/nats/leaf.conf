# Edge leaf node (local dev). Local clients use port 4222; the leaf bridges to the hub
# whenever the "space link" is up. JetStream requests are forwarded to the hub.
port: 4222

# Detect a silent link loss in ~30-40 s instead of 4-6 min, so the leaf redials instead
# of waiting on TCP retransmission backoff (ADR-0006). Server-wide: also applies to
# local clients (the agent), harmless on localhost.
ping_interval: "10s"
ping_max: 3

leafnodes {
  remotes: [
    { url: "nats-leaf://hub:7422" }
  ]
}
