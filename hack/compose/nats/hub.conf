# Hub NATS server (local dev). Production config lives in gitops/platform/nats-hub.
server_name: hub
port: 4222
http_port: 8222

jetstream {
  # Named domain: edge clients reach this JetStream through their leaf node by using
  # the "hub" domain ($JS.hub.API.>), which is forwarded over the leaf connection.
  domain: hub
  store_dir: /data
  max_memory_store: 256MB
  max_file_store: 1GB
}

# Edge leaf nodes connect here.
leafnodes {
  port: 7422
}
