# Opens/updates a "release PR" from Conventional Commits on main (version bump +
# CHANGELOG.md). Merging it creates the tag (e.g. agent-v0.2.0) and the GitHub release,
# which triggers the versioned image build in agent.yml.
name: release-please

on:
  push:
    branches: [main]

# GITHUB_TOKEN is not used to write: release-please acts with a short-lived GitHub App
# token instead (see CONTRIBUTING.md §7), for two reasons:
# - this repository does not allow GITHUB_TOKEN to create pull requests;
# - tags created with GITHUB_TOKEN do not trigger other workflows (agent.yml on agent-v*).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: only what release-please needs, only on this repository.
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
