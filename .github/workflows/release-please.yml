# Opens/updates a "release PR" from Conventional Commits on main (version bump +
# CHANGELOG.md). Merging it creates the tag (e.g. agent-v0.2.0) and the GitHub release,
# which triggers the versioned image build in agent.yml.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Note: tags created with GITHUB_TOKEN do not trigger other workflows.
          # Use a fine-grained PAT or a GitHub App token here to trigger agent.yml on tags.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
