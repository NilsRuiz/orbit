name: gitops

on:
  pull_request:
    # operator/config is built into the hub's GitOps (gitops/platform/operator).
    paths: ["gitops/**", "operator/config/**", ".github/workflows/gitops.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install kustomize and kubeconform
        # Pinned: "latest" lets a new release turn CI red with no change here.
        run: |
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build and validate every kustomization
        run: |
          set -euo pipefail
          for k in $(find gitops -name kustomization.yaml -exec dirname {} \;); do
            echo "::group::$k"
            kustomize build "$k" | kubeconform -strict -summary \
              -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          done
