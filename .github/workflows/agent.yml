name: agent

on:
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]
  push:
    branches: [main]
    paths: ["agent/**", ".github/workflows/agent.yml"]
    tags: ["agent-v*"]   # created by release-please

permissions:
  contents: read

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

# Security note: pin third-party actions to a full commit SHA (Dependabot keeps them
# up to date). Tags are mutable and have been hijacked in real supply-chain attacks.
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned: "latest" lets new linter releases turn CI red with no code change.
          version: v2.15.0
          working-directory: agent

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # keyless cosign signing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - id: tags
        name: Compute image name and tags
        run: |
          # OCI repository names must be lowercase; the owner keeps its case (e.g. NilsRuiz).
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/orbit-agent"
          tags="${image}:sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/agent-v* ]]; then
            tags="${tags},${image}:${GITHUB_REF_NAME#agent-v}"
          else
            tags="${tags},${image}:main"
          fi
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: agent
          platforms: linux/amd64,linux/arm64   # edge hardware is often ARM
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless)
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Scan image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker run --rm aquasec/trivy:0.76.2 image --exit-code 1 --severity CRITICAL,HIGH \
            --ignore-unfixed "${IMAGE}@${DIGEST}"
