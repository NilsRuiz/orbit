version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
    groups:
      nats:
        patterns: ["github.com/nats-io/*"]
  # Modules released in lockstep are grouped: bumping one alone leaves mismatched versions.
  - package-ecosystem: gomod
    directory: /operator
    schedule: { interval: weekly }
    groups:
      nats:
        patterns: ["github.com/nats-io/*"]
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      otel:
        patterns: ["go.opentelemetry.io/*"]
  - package-ecosystem: terraform
    directories: ["/infra/terraform/envs/*", "/infra/terraform/bootstrap"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directories: ["/agent", "/operator"]
    schedule: { interval: weekly }
