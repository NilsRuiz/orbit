version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
    groups:
      nats:
        patterns: ["github.com/nats-io/*"]
  - package-ecosystem: terraform
    directories: ["/infra/terraform/envs/*", "/infra/terraform/bootstrap"]
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /agent
    schedule: { interval: weekly }
