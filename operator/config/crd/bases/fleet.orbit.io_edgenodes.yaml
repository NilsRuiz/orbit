  names:
    kind: EdgeNode
    listKind: EdgeNodeList
    plural: edgenodes
    shortNames:
    - en
    singular: edgenode
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.currentVersion
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.reachability
      name: Reach
      type: string
    - jsonPath: .status.lastSeen
      name: LastSeen
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          EdgeNode mirrors one edge node (one agent) on the hub. Created by the operator from
          heartbeats; never edited by hand.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: EdgeNodeSpec is the expected behaviour of an edge node.
            properties:
              contactInterval:
                default: 5m
                description: |-
                  contactInterval is the expected interval between two contact windows (e.g. one orbit
                  ≈ 95m for LEO). A node silent for twice this interval becomes Unreachable.
                type: string
            type: object
          status:
