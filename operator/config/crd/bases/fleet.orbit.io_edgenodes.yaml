                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentVersion:
                description: currentVersion is the version the agent runs (its last
                  known-good version).
                type: string
              lastSeen:
                description: lastSeen is the time of the last heartbeat or status
                  event.
                format: date-time
                type: string
              phase:
                description: phase is the agent's state machine phase.
                enum:
                - idle
                - applying
                - verifying
                - rolled-back
                type: string
              reachability:
                description: reachability is derived from lastSeen and spec.contactInterval.
                enum:
                - Reachable
                - Unreachable
                type: string
              rolloutId:
                description: rolloutId is the rollout that produced the node's current
                  desired state.
                type: string
            type: object
