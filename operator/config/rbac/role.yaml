---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - fleet.orbit.io
  resources:
  - edgenodes
  verbs:
  - create
  - get
  - list
  - patch
  - watch
- apiGroups:
  - fleet.orbit.io
  resources:
  - edgenodes/status
  verbs:
  - get
  - patch
