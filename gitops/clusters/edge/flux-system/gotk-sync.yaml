# What Flux reconciles on an edge cluster: this repository (public, so no credentials), path
# gitops/clusters/edge. That path contains this directory too, so Flux manages its own
# installation: upgrading Flux is a PR that regenerates gitops/flux/gotk-components.yaml.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/NilsRuiz/orbit
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/clusters/edge
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
