apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nats-hub
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/platform/nats-hub
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: monitoring
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/platform/monitoring
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
# TODO(phase 2): Kustomization for the operator (config/default from operator/), depends on nats-hub.
