# Hub platform, in dependency order: NATS (JetStream domain "hub"), then the operator,
# which creates its KV bucket and status stream in it.
# Monitoring (gitops/platform/monitoring) joins in Phase 4, with the SLOs it serves.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nats-hub
  namespace: flux-system
spec:
  interval: 10m
  path: ./gitops/platform/nats-hub
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Per-cluster values, all with defaults: an orbit-hub ConfigMap is optional.
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: orbit-hub
        optional: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: operator
  namespace: flux-system
spec:
  dependsOn:
    - name: nats-hub
  interval: 10m
  path: ./gitops/platform/operator
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
