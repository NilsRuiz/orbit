apiVersion: v1
kind: Namespace
metadata:
  name: nats
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: nats
spec:
  interval: 24h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats-leaf
  namespace: nats
spec:
  interval: 30m
  chart:
    spec:
      chart: nats
      version: "2.15.3" # same as the hub (gitops/platform/nats-hub)
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    # Small footprint for edge hardware.
    container:
      merge:
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
      patch:
        - op: add
          path: /volumeMounts/-
          value: { name: nats-creds, mountPath: /etc/nats-creds, readOnly: true }
    config:
      # The hub refuses a second leaf connection with the same server name ("Duplicate
      # Remote LeafNode Connection"), and the default is the pod name, the same on every
      # satellite: prefix it with the node ID.
      serverNamePrefix: "${NODE_ID}-"
      # Detect a silent link loss in ~30-40 s instead of 4-6 min (ADR-0006). Merged at the
      # root of nats.conf; server-wide, so it also applies to local clients (the agent).
      merge:
        ping_interval: "10s"
        ping_max: 3
      leafnodes:
        enabled: true
        merge:
          remotes:
            - url: ${HUB_LEAF_URL}  # substituted by Flux postBuild
              # The node's NATS user (ADR-0010): what this node may do on the hub. A
              # Secret created at bootstrap, like the orbit-node ConfigMap.
              credentials: /etc/nats-creds/node.creds
    podTemplate:
      patch:
        - op: add
          path: /spec/volumes/-
          value: { name: nats-creds, secret: { secretName: nats-leaf-creds } }
    # No JetStream here: status events published while the link is down are lost, and the
    # next heartbeat re-syncs the current version. Local JetStream with a status stream
    # sourced into the hub is on the agent's roadmap (agent/README.md, store-and-forward).
