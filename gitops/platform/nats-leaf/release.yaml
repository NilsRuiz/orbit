apiVersion: v1
kind: Namespace
metadata:
  name: nats
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: nats
spec:
  interval: 24h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats-leaf
  namespace: nats
spec:
  interval: 30m
  chart:
    spec:
      chart: nats
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    # Small footprint for edge hardware.
    container:
      merge:
        resources:
          requests: { cpu: 50m, memory: 64Mi }
          limits: { memory: 256Mi }
    config:
      leafnodes:
        enabled: true
        merge:
          remotes:
            - url: ${HUB_LEAF_URL}  # substituted by Flux postBuild
    # TODO(phase 3): enable JetStream with domain "${NODE_ID}" and source a local status
    # stream into the hub, so status survives long link outages (agent/README.md).
