apiVersion: v1
kind: Namespace
metadata:
  name: nats
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nats
  namespace: nats
spec:
  interval: 24h
  url: https://nats-io.github.io/k8s/helm/charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
  namespace: nats
spec:
  interval: 30m
  chart:
    spec:
      chart: nats
      # Chart versions follow nats-server since 2.x. 2.15.3 is the server version the
      # agent and operator integration tests run against.
      version: "2.15.3"
      sourceRef:
        kind: HelmRepository
        name: nats
  values:
    config:
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 5Gi
        merge:
          domain: hub # edge clients use $JS.hub.API via their leaf node (ADR-0002)
      leafnodes:
        enabled: true
        port: 7422
      monitor:
        enabled: true
    promExporter:
      enabled: true
---
# Leaf-node port exposed only inside the VPC (no public LB, ADR-0005).
apiVersion: v1
kind: Service
metadata:
  name: nats-leafnodes
  namespace: nats
  annotations:
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 10.10.0.0/20 # edge subnet (infra/terraform/modules/network nodes_cidr)
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: nats
  ports:
    - name: leafnodes
      port: 7422
      targetPort: 7422
