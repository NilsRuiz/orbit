apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "*" # pin once tested
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Sized for a 1–2 node spot pool.
    alertmanager:
      enabled: true
    grafana:
      enabled: true
      # Access with: kubectl -n monitoring port-forward svc/kube-prometheus-stack-grafana 3000:80
    prometheus:
      prometheusSpec:
        retention: 3d
        resources:
          requests: { cpu: 100m, memory: 512Mi }
        serviceMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
