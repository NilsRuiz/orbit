# Stand-in "satellite payload": podinfo exposes versions and health endpoints, handy to
# demo upgrades and failing health checks. The image tag is owned by the agent at runtime
# (phase 3 K3s payload driver), not by Git.
apiVersion: v1
kind: Namespace
metadata:
  name: payload
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payload
  namespace: payload
  labels:
    app: payload
    orbit.io/node-id: ${NODE_ID}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payload
  template:
    metadata:
      labels:
        app: payload
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - containerPort: 9898
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
          livenessProbe:
            httpGet: { path: /healthz, port: 9898 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
