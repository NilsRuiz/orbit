# orbit-agent on an edge cluster. Per-node values (${NODE_ID}, ${NODE_LABELS}) are
# substituted by Flux from the orbit-node ConfigMap. Bump the image after an agent release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orbit-system
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - state.yaml
  - deployment.yaml
images:
  - name: orbit-agent
    newName: ghcr.io/nilsruiz/orbit-agent
    newTag: "0.5.1" # >= 0.5.0: per-node inbox prefix, required by the NATS credentials (ADR-0010)
